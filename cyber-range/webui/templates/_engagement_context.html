<div class="engagement-context">
  <div>
    <span class="label">Engagement setup · 2 of 3</span>
    {% if engagement_purpose %}
    <strong>{{ engagement_purpose.label }}</strong>
    {% else %}
    <strong>Purpose not selected</strong>
    {% endif %}
  </div>
  <span class="engagement-context__sep"><i class="fa-solid fa-arrow-right"></i></span>
  <div>
    <span class="label">Source</span>
    <strong>{{ engagement_source }}</strong>
  </div>
  <div class="spacer"></div>
  <a href="{{ url_for('new_engagement', source=engagement_source | lower, purpose=engagement_purpose.id if engagement_purpose else '') }}" class="btn btn-sm btn-ghost">Change</a>
</div>
